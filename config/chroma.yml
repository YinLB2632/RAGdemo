collection_name: agent
persist_directory: chroma_db
k: 5
data_path: data
md5_hex_store: md5.json
allow_knowledge_file_type: ["txt", "pdf", "md", "docx", "csv", "xlsx", "html"]

chunk_size: 400
chunk_overlap: 60
separators: ["\n\n", "\n", ".", "!", "?", "。", "！", "？", " ", ""]

# 混合检索配置
bm25_k: 10             # BM25 召回候选数
vector_k: 10           # 向量检索召回候选数
hybrid_top_k: 4        # RRF 合并后最终返回给 LLM 的数量
