collection_name: agent
persist_directory: chroma_db
k: 5
data_path: data
md5_hex_store: md5.json
allow_knowledge_file_type: ["txt", "pdf", "md", "docx", "csv", "xlsx", "html"]

# 语义切分配置（SemanticChunker）
# breakpoint_threshold_type 可选: percentile | standard_deviation | interquartile | gradient
# percentile: 相邻句子语义距离超过第 N 百分位时切分，值越大 chunk 越粗，值越小 chunk 越细
semantic_breakpoint_type: percentile
semantic_breakpoint_threshold: 90

# 混合检索配置
bm25_k: 10             # BM25 召回候选数
vector_k: 10           # 向量检索召回候选数
hybrid_top_k: 8        # RRF 合并后送入 Reranker 的候选数（Reranker 再从中选 rerank_top_n）
rrf_score_threshold: 0.003  # RRF 分数低于此值的结果直接丢弃，避免不相关内容传入 LLM
